<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First run, cane line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{--brand:#4CCFE6;--scrim:rgba(0,0,0,.78);--t2:#C7C7CC}
body{margin:0;background:#000}
.s{position:relative;width:412px;height:915px;overflow:hidden;background:#000;color:#fff;font-family:'Noto Sans','Noto Sans Devanagari','Noto Sans Tamil',system-ui,sans-serif}
.s,.s *{box-sizing:border-box}
.scene{position:absolute;left:0;top:0;width:412px;height:915px;display:block}
.shade{position:absolute;left:0;top:0;width:412px;height:915px;background:rgba(0,0,0,.45)}
.strip{position:absolute;left:16px;right:16px;top:40px;min-height:44px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:var(--scrim);border-radius:12px}
.wm{font-size:16px;font-weight:700;color:var(--brand);letter-spacing:.2px;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;color:#fff;line-height:1}
.chip.on{color:#30D158;border-color:rgba(48,209,88,.55)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor}
.mic{margin-left:auto;color:var(--t2);display:flex}
.dock{position:absolute;left:16px;right:16px;bottom:28px}
.cap{background:var(--scrim);border:2px solid #fff;border-radius:12px;padding:16px 16px 16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ic{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;flex:none}
.src{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:#A8A8AE;color:#000;font-size:12px;font-weight:800;letter-spacing:.6px;line-height:1}
.meta{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--t2);margin-left:auto}
.l1{font-size:30px;font-weight:700;line-height:1.3}
.l2{font-size:20px;font-weight:400;color:var(--t2);line-height:1.35;margin-top:6px}
.dots{display:flex;gap:8px;margin-top:16px}
.dots i{display:block;width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.dots i.f{background:var(--brand);border-color:var(--brand)}
</style>
</helmet>
<div class="s">
  <img class="scene" src="./scene.svg" alt="">
  <div class="shade"></div>

  <div class="strip">
    <span class="wm">Drishti</span>
    <span class="chip">Hinglish</span>
    <span class="chip on"><i class="dot"></i>Online</span>
    <span class="mic" aria-label="Idle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
  </div>

  <div class="dock">
    <div class="cap">
      <div class="top">
        <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="White cane"><path d="M9 21V8a4 4 0 0 1 8 0"/></svg></span>
        <span class="src">SYSTEM</span>
        <span class="meta">First run · 2/7</span>
      </div>
      <div class="l1">Drishti aapki cane ke saath kaam karta hai, uski jagah nahi.</div>
      <div class="l2">Drishti works with your cane, not instead of it.</div>
      <div class="dots" role="img" aria-label="Step 2 of 7"><i class="f"></i><i class="f"></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
