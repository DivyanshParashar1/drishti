<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Permission, camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--brand:#4CCFE6;--t2:#C7C7CC}
body{margin:0;background:#000}
.s{position:relative;width:412px;height:915px;overflow:hidden;background:#000;color:#fff;font-family:'Noto Sans',system-ui,sans-serif}
.s,.s *{box-sizing:border-box}
.wm{position:absolute;left:0;top:48px;width:412px;text-align:center;font-size:16px;font-weight:700;color:var(--brand);letter-spacing:.2px}
.grp{position:absolute;left:16px;right:16px;top:0;height:915px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.ttl{font-size:20px;font-weight:700;line-height:1.3;margin:0}
.bdy{font-size:16px;font-weight:400;line-height:1.5;color:var(--t2);margin:0;max-width:320px}
.btn{width:100%;height:56px;margin-top:20px;border:0;border-radius:12px;background:var(--brand);color:#000;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer}
</style>
</helmet>
<div class="s">
  <div class="wm">Drishti</div>
  <div class="grp">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#4CCFE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <h1 class="ttl">Allow the camera</h1>
    <p class="bdy">Drishti needs the camera to see what's ahead.</p>
    <button class="btn" type="button">Allow camera</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
