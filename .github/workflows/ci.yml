# Checks every push and pull request. Uses no secrets: live tests (real Gnani/VLM credits) stay
# skipped by pytest's default "-m 'not live'".
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the runtime image (what Cloud Run builds)
        run: docker build -t drishti-relay:ci server
      - name: Smoke test /health
        run: |
          docker run -d --name relay -e APP_TOKEN=ci-token -p 8080:8080 drishti-relay:ci
          for i in $(seq 1 30); do
            if curl -sf -H "Authorization: Bearer ci-token" http://localhost:8080/health; then
              echo; echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs relay
          exit 1
      - name: Runs as non-root
        run: test "$(docker run --rm drishti-relay:ci id -u)" != "0"
      - name: Build the dev image (docker compose)
        run: docker compose build

  app:
    name: App tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --ci
      - run: npm run typecheck
