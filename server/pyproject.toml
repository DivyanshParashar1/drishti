[project]
name = "drishti-relay"
version = "0.1.0"
description = "Thin relay for Drishti: holds API keys, relays Gnani STT/TTS and the vision model"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "websockets",
    "pydantic-settings",
    "python-multipart",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real Gnani/VLM APIs and spends credits (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
