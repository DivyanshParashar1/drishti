[project]
name = "drishti-relay"
version = "0.1.0"
description = "Thin relay for Drishti: holds API keys, relays Gnani STT/TTS and the vision model"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "websockets",
    "pydantic-settings",
    "python-multipart",
    "google-genai>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout>=2.4.0",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real Gnani/VLM APIs and spends credits (run with -m live)"]
addopts = "-m 'not live' --timeout 20"

[tool.ruff]
line-length = 100
target-version = "py311"
