# Local development for the relay (server/). No Python or uv needed on the host.
#
#   docker compose up              relay on http://localhost:8000 with live reload of server/app
#   docker compose run --rm test   server test suite (live, credit-spending tests stay skipped)
#
# Keys come from server/.env (copy server/.env.example). Without it the relay still starts with
# APP_TOKEN=dev-token and no Gnani/VLM keys, so /health works but /tts, /stt and /ask don't.

x-relay-build: &relay-build
  context: ./server
  target: dev

services:
  relay:
    build: *relay-build
    image: drishti-relay:dev
    env_file:
      - path: ./server/.env
        required: false
    environment:
      PORT: "8000"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./server/app:/srv/app
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/docker-healthcheck.py"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  test:
    build: *relay-build
    image: drishti-relay:dev
    profiles: ["test"]
    # Only what the tests read is mounted, never server/.env, so real keys can't reach them.
    volumes:
      - ./server/app:/srv/app:ro
      - ./server/tests:/srv/tests:ro
      - ./server/scripts:/srv/scripts:ro
      - ./server/bench:/srv/bench:ro
      - ./server/phrases.json:/srv/phrases.json:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["pytest"]
